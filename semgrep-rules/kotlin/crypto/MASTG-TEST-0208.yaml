rules:
  - id: MASTG-TEST-0208
    severity: WARNING
    languages:
      - kotlin
    metadata:
      summary: This rule looks for methods that create a weak key size in encryption algorithms.
    message: "[MASVS-CRYPTO] Make sure that the key size is according to security best practices"
    patterns:
      - pattern-either:
        - pattern: MD5
        - pattern: MD4
        - pattern: SHA1
        - pattern: |
            $K = KeyPairGenerator.getInstance("RSA")
            ...
            $K.initialize(1024, SecureRandom())
        - pattern: |
            $K = KeyPairGenerator.getInstance("RSA")
            ...
            $K.initialize(512, SecureRandom())
        - pattern: |
            $K = KeyPairGenerator.getInstance("RSA")
            ...
            $K.initialize(256, SecureRandom())
        - pattern: |
            $K = KeyGenerator.getInstance("AES")
            ...
            $K.init(128, SecureRandom())
        - pattern: |
            $K = KeyGenerator.getInstance("AES")
            ...
            $K.init(256, SecureRandom())
