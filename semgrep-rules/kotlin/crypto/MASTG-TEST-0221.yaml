
rules:
  - id: MASTG-TEST-0221
    languages:
      - kotlin
    severity: WARNING
    metadata:
      summary: This rule looks for weak encryption algorithms.
    message: "[MASVS-CRYPTO-1] Weak encryption algorithms found in use."
    pattern-regex: Cipher\.getInstance\("?(DES|DESede|RC4|Blowfish)(/[A-Za-z0-9]+(/[A-Za-z0-9]+)?)?"?\)