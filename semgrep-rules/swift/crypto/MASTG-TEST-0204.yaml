rules:
- id: MASTG-TEST-0204
  metadata:
    summary: Innapropriate key sizes.
  message: >-
    A random number generator was detected which is **not** *guaranteed* to be
    Cryptographically secure. If the source of entropy is used for security
    purposes (e.g. with other Cryptographic operations), make sure to use the
    `SecCopyRandomBytes` API explicitly.
  severity: WARNING
  languages:
  - swift
  paths:
    exclude:
      - ViewDataSampleFactory.swift
  pattern-either:
  - pattern: random()
  - pattern: Int.random(...)
  - pattern: Bool.random(...)
  - pattern: Float.random(...)
  - pattern: Double.random(...)
  - pattern: arc4random()
  - pattern: arc4random_buf(...)
  - pattern: arc4random_uniform(...)
  - pattern: SystemRandomNumberGenerator(...)
  - pattern: $VARIABLE.randomElement(...)
  - pattern: rand()


  ## Details

In the class `AuthenticationUrlFactoryImpl` one of the parameter for the login url is a `nonce` 

> A random or non-repeating value that is included in data exchanged by a protocol, usually for the purpose of guaranteeing the transmittal of live data rather than replayed data, thus detecting and protecting against replay attacks.
>

In most system, the expectation is that a nonce is generated using a cryptographically secure random number generator. This is to ensure that the nonce is not predictable and cannot be easily guessed by an attacker.